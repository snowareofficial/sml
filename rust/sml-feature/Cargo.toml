[package]
name = "sml-feature"
# 0.1.0-alpha.3：Version / FeatureSet::for_version 支持 v1..v4 版本基线
# （v2+ 关闭 bareword-string；v4 与 v3 基集相同）。
version.workspace = true
edition = "2021"
description = "SML 版本与特性系统（纯数据层）：Version、Feature/FeatureSet 及名字注册表。"
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
readme = "README.md"

[lib]
name = "sml_feature"

[dependencies]
sml-value = { path = "../sml-value", version = "0.6.9-dev.0", default-features = false }

[features]
default = []