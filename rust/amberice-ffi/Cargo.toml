[package]
name = "amberice-ffi"
version.workspace = true
edition = "2021"
description = "C ABI for `.ambr`: decode bytes to canonical text. Independent cdylib so `amberice` stays a pure rlib."
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
authors = ["Sal <sal@mail.swebase.cn>"]
publish = false

[lib]
# 产物名 = `amberice_ffi.dll` / `libamberice_ffi.so`。
# 不能叫 `amberice`：`amberice` crate 的 rlib 已经占了那个名字（同一图里重名会冲突）。
name = "amberice_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 只依赖容器层；不拖 swsml / sml-parse（半独立，见 spec §13.1）。
# 只用 path：带 `version` 时 cargo 会拿 workspace 版本做匹配，预发布号容易踩空。
# 是 `../amberice`，不是 `..` —— `..` 是 workspace 根（包名 `swsml`）。
amberice = { path = "../amberice" }

# 可选：把 SML 源文本解析成值，供「写入」路径（`ambr_pack_text`）使用。
# 为什么关在 FFI 层：`amberice` 的硬约束是「容器层不依赖 SML 解析器」——那是它能被
# 非 SML 项目独立采用的理由。便捷写入属于绑定层，不能反过来污染格式 crate。
# ｜ Optional: parse SML source for the write path. Kept here so the format crate
#   stays parser-free.
[dependencies.sml]
package = "swsml"
path = ".."
optional = true

[features]
default = []
# 打开才有 `ambr_pack_text`；不打开时 cdylib 仍只有读能力，依赖树不变。
sml = ["dep:sml"]
# wasm32 目标：转发 `amberice` 的 32 位风险门（`u64 as usize` 截断）。
# 默认拒编；`js/build_ambr_wasm.py` 在编译 wasm 时显式带上。
# ｜ wasm32 only: opt in to the 32-bit truncation risk; native builds never need it.
allow-32bit = ["amberice/allow-32bit"]
