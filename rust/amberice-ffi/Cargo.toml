[package]
name = "amberice-ffi"
version.workspace = true
edition = "2021"
description = "C ABI for `.ambr`: decode bytes to canonical text. Independent cdylib so `amberice` stays a pure rlib."
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
authors = ["Sal <sal@mail.swebase.cn>"]
publish = false

[lib]
# 产物名 = `amberice_ffi.dll` / `libamberice_ffi.so`。
# 不能叫 `amberice`：`amberice` crate 的 rlib 已经占了那个名字（同一图里重名会冲突）。
name = "amberice_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 只依赖容器层；不拖 swsml / sml-parse（半独立，见 spec §13.1）。
# 只用 path：带 `version` 时 cargo 会拿 workspace 版本做匹配，预发布号容易踩空。
# ⚠️ 是 `../amberice`，不是 `..` —— `..` 是 workspace 根（包名 `swsml`）。
amberice = { path = "../amberice" }
