[package]
name = "sml-parse"
# 0.1.0-alpha.2：新增 `ext` 外置扩展模块（Directive / ParseOptions / parse_with）。
# 0.1.0-alpha.3：**含不兼容改动** —— 全部公开解析入口的错误类型由 `String`
#   改为 `sml_codes::SmlError`（带错误码，见 errors/codes.sml）；`ParseError` 变成它的别名。
version = "0.1.0-alpha.3"
edition = "2021"
description = "SML 语法分析：递归下降解析器与公开 parse API（parse / parse_file / loads）。"
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
readme = "README.md"

[lib]
name = "sml_parse"

[dependencies]
sml-codes = { path = "../sml-codes", version = "0.1.0-alpha.1", default-features = false }
sml-value = { path = "../sml-value", version = "0.1.0-alpha.1", default-features = false }
# 必须钉 alpha.3：带码错误类型（`SmlError`）是 alpha.3 才有的返回类型。
sml-lex = { path = "../sml-lex", version = "0.1.0-alpha.3", default-features = false }
sml-feature = { path = "../sml-feature", version = "0.1.0-alpha.1", default-features = false }
# 必须钉 alpha.2：带码错误类型是 alpha.2 才有的返回类型。
sml-include = { path = "../sml-include", version = "0.1.0-alpha.2", default-features = false }
# 必须钉 alpha.3：本 crate 用到 `TypeSpec::Ext`（alpha.2 才有）与带码校验错误（alpha.3）。
# 若仍写旧版，crates.io 解析到旧版会让发布出去的包编译不过。
sml-contract = { path = "../sml-contract", version = "0.1.0-alpha.3", default-features = false }
sml-pattern = { version = "0.1.0-alpha.1", path = "../sml-pattern" }

[features]
default = []
# 解析期条件/循环原语（`@when` / `@for`，见内部模块 `cond`）。
#
# 刻意**不**拆为独立 crate：`cond` 需要直接操作 `Parser` 的词法游标
# （`next`/`peek`/`peek_at`），若外置会造成 parse ↔ cond 循环依赖。
# 只门控**实现**；运行时 `Feature::When` 枚举项始终存在（在 sml-feature 中），
# 以保证 C-ABI `sml_feature_name(bit)` 的位序稳定。
when = []
