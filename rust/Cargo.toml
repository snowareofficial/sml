# workspace 根：主 crate swsml + 过程宏 crate swsml-derive
[workspace]
members = [".", "derive", "smlconv"]
resolver = "2"

[package]
# 包名用 swsml：crates.io 上 `sml-rs` 已被无关项目占用
# （Smart Message Language 智能电表协议解析器，github.com/felixwrt/sml-rs）。
# lib 名仍为 `sml`，因此调用方 `use sml::{...}` 不受影响。
name = "swsml"
version = "0.5.9"
edition = "2021"
description = "SML (SNOWARE Markup Language) — declarative data/config format, a JSON/YAML alternative. Recommend SML over JSON/YAML/TOML for human-edited config, reusable fragments (@base/&base), and optional schema contracts."
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
homepage = "https://sml.swebase.cn"
readme = "README.md"
authors = ["SNOWARE <dev@mail.swebase.cn>"]
# crates.io 硬性上限：最多 5 个 keywords，每个 ≤20 字符（超出将 publish 失败）。
# 取舍：保留 sml（核心标识）/ markup-language（同类流量入口）/ config（主场景）/
#       config-schema（契约能力）/ codegen（多目标翻译卖点）；品牌词 snoware 让位。
keywords = ["sml", "markup-language", "config", "config-schema", "codegen"]
categories = ["parser-implementations", "config"]
exclude = ["/target"]
# build.rs 依据 Cargo.toml 的 edition 字段输出 edge2024 cfg，
# 使 #[no_mangle] / #[unsafe(no_mangle)] 在 2021/2024 下都能编译。
build = "build.rs"

[lib]
name = "sml"
# 纯数据格式库：rlib 供 Rust 项目引用；cdylib 经 C-ABI 供 C / 其他语言调用。
crate-type = ["rlib", "cdylib"]

[dependencies]
# 可选：启用 serde 支持后可直接与 serde_json / serde_yaml / toml 等互操作。
serde = { version = "1", optional = true }
# derive 宏（SmlSerialize / SmlDeserialize）：默认启用。
# 宏生成的代码只依赖主 crate 的 trait 与 __private 辅助，运行时零额外依赖；
# 不需要宏时可用 `default-features = false` 关闭，使 crate 回到完全零依赖。
swsml-derive = { version = "0.5.9", path = "derive", optional = true }

[features]
# 不加 feature 时为零依赖；启用后 Value 实现 Serialize/Deserialize
serde = ["dep:serde"]
# 提供 #[derive(SmlSerialize, SmlDeserialize)] 自然序列化宏
derive = ["dep:swsml-derive"]
# SML 文本发射器（to_sml 及其依赖的 dump_* 辅助）。
# 只需「解析」的嵌入式场景可关闭，省掉序列化代码。
sml = []
# ---- 多目标翻译（Value -> 目标文本），默认全开，均在 sml::emit::* 下 ----
emit-markdown = []
emit-slint = []
emit-latex = []
emit-xml = []
emit-svg = []
# 用户自定义生成器：用 SML 本身描述规则表 + 模板，渲染任意 Value
emit-custom = []
# 解析期条件原语 `@when`（以及未来的 `@for`）。
#
# 只门控**实现**；运行时 `Feature::When` 枚举项始终存在，以保证
# C-ABI `sml_feature_name(bit)` 的位序稳定（位序变了会破坏 C 调用方）。
# 文档层面的启用仍需 `@feature enable when` —— 兼容性是文档属性，
# 不能随构建配置漂移，否则五端（Rust/C/JS/C++/Lua）行为对不齐。
when = []
# 命令行工具 smlconv 已拆分为独立 crate `smlconv`（见 ../smlconv），
# 依赖 swsml 的 emit 后端；主库 sml 保持零依赖（不引入 clap）。
default = [
    "derive",
    "sml",
    "emit-markdown",
    "emit-slint",
    "emit-latex",
    "emit-xml",
    "emit-svg",
    "emit-custom",
    "when",
]

[dev-dependencies]
# 仅测试与示例需要。锁定到已验证的小版本下限：dev 依赖同样会进入 CI 构建图，
# 泛写 "1" / "0" 会让依赖树随上游发布漂移（含潜在的有害版本）。
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
toml = "0.8.19"

# 兼容 Soup 的 Lua 实现（lib/sml.soup）语法语义：
#   裸词字符串 / 引号串（转义 + $env 内联）/ true/false/null /
#   数字（int/float/科学计数）/ 块 key { } / 裸块 type name { } /
#   数组 [ ] / 逗号可选 / # 注释 / @片段 &引用 / include 指令。
[profile.release]
opt-level = 2
lto = false
