[package]
name = "smlb"
# `.smlb` = 通用二进制信封（不可变 · 可寻址 · 可验证；SML 是内置载荷之一。`docs/smlb-smldb-spec.md`，D2：编 `Value`）。
#
# 为什么独立成 crate（D3）：**只依赖值模型** —— 「读一个文件不必拖进解析器」。
# 本 crate 的默认构建连 `sml-value` 的 `sml`（文本发射器）特性都不需要：
# canonical 文本只用 `sml-value` 里那份共享的「文本原子规则」。
#
# ⚠️ 发布节奏（D1）：`.smlb` / `smldb` 与 v5 一起开放，故 `publish = false`。
version.workspace = true
edition = "2021"
description = "通用二进制信封 .smlb：不可变 · 可寻址 · 可签名校验；SML 是内置载荷之一。"
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
authors = ["Sal <sal@mail.swebase.cn>"]
publish = false

[lib]
name = "smlb"
path = "src/lib.rs"

[[bin]]
name = "smlb"
path = "src/main.rs"

[dependencies]
sml-value = { version = "0.6.9-dev.0", path = "../sml-value" }
# 签名（T4）：**只有 `sign` feature 下才进来**（用户 2026-11-04 批准引入，要求避开 RustSec 热点）。
#
# 选型台账（2026-11-05 实测 RustSec）：
# - `ed25519-dalek` 3.0：历史上只有 RUSTSEC-2022-0093（双公钥签名预言机，1.0.1 起修复）；
# - `curve25519-dalek`（间接）：RUSTSEC-2024-0344（标量减法时序），>= 4.1.3 已修，3.0 带 5.x 早已越过；
# - `getrandom`：无公告页，仅 keygen 取熵（D41：熵只进一次性标识）。
# 被**排除**的同期热点：`ring`（RUSTSEC-2025-0010 直接标 unmaintained）、
# `ruzstd`（2026-10-13 HIGH 解压炸弹）、`zstd` 绑定（2026-10-26 三条新公告，属 T5，等冷却）。
ed25519-dalek = { version = "3.0", optional = true }
getrandom = { version = "0.3", optional = true }

[features]
# 对象保序（转发到 sml-value）：**canonical 的前提**（spec §18 C2）。
#
# 为什么默认关、而不是让本 crate 硬开：cargo 的特性是**按构建图取并集**的，
# 本 crate 若硬开，`cargo test --workspace`（CI 的命令）会把整个 workspace 的
# `sml-value` 一起切到保序档 —— 那等于顺手改掉 swsml / smltools 的既有行为，
# 而它们是「默认档 = BTreeMap 字节序」的成百条 golden 用例。
# 故：本 crate 自己跑时显式带 `--features preserve_order`
# （不带的后果是**明确报错**而不是悄悄排序，见 `CanonicalError::KeyOrderUnavailable`）。
preserve_order = ["sml-value/preserve_order"]
# 层链签名（T4）：`smlb sign / append / verify / keygen / tree` 的验签部分。
# 关掉后**仍能读**层链（序号/prev_hash 这些不需要密码学），只是签名为「未校验」。
sign = ["dep:ed25519-dalek", "dep:getrandom"]
default = []
