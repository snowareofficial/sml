[package]
name = "sml-value"
# 0.1.0-alpha.3：源码有改动（`use std::fmt` 加 `#[cfg(feature = "sml")]`，消掉
#   未开该特性时每个下游各背一条 `unused import` 警告）。**API 与语义都没变** ——
#   故下游的版本要求**不必**跟着抬（惯例是只声明实际需要的最小版本），
#   但本 crate 的版本必须动：否则「同一个版本号、两份不同内容」。
version.workspace = true
edition = "2021"
description = "SML 值模型：Value 类型、SML 文本表示（to_sml）与 serde 桥接。零依赖，可单独用于嵌入式场景。"
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
readme = "README.md"

[lib]
name = "sml_value"

[dependencies]
serde = { version = "1", optional = true }

[features]
# SML 文本序列化器（to_sml）。只需解析/承载数据时可关闭，回到完全零依赖。
sml = []
# Value 的 Serialize/Deserialize 实现 + to_value/from_value 桥接。
# 注：吃 SML 文本的 `from_str` 在门面 crate（需要解析器）。
serde = ["dep:serde"]
# 对象保序：`Value::Object` 由 `BTreeMap<String, Value>` 换成保源序的
# `Vec<Entry>` + 惰性三档索引（docs/value-layout.md §3/§5）。
#
# **默认关闭**（对标 toml-rs 的 `preserve_order`）：
# - 默认档输出键按 UTF-8 字节序，与历史版本逐字节一致；
# - 开启档输出键 == 源序，`parse → 改 → to_sml` 键序稳定。
#
# 两档的 `PartialEq` **都是集合相等**（§6.1），顺序敏感另走 `Value::eq_ordered`；
# 确定性字节另走 `to_sml_canonical`（§6.2）—— 四个开关互不牵连。
# 零依赖铁律不变：保序实现是本 crate 自实现的，不引 indexmap 等第三方。
preserve_order = []
default = []