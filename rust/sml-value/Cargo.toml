[package]
name = "sml-value"
# 0.1.0-alpha.3：源码有改动（`use std::fmt` 加 `#[cfg(feature = "sml")]`，消掉
#   未开该特性时每个下游各背一条 `unused import` 警告）。**API 与语义都没变** ——
#   故下游的版本要求**不必**跟着抬（惯例是只声明实际需要的最小版本），
#   但本 crate 的版本必须动：否则「同一个版本号、两份不同内容」。
version.workspace = true
edition = "2021"
description = "SML 值模型：Value 类型、SML 文本表示（to_sml）与 serde 桥接。零依赖，可单独用于嵌入式场景。"
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
readme = "README.md"

[lib]
name = "sml_value"

[dependencies]
serde = { version = "1", optional = true }

[features]
# 32 位目标默认**拒绝编译**：本 crate 有多处 `u64 as usize` / `usize as u32`，
# 依赖 64 位指针宽度。确实要在 32 位跑（嵌入式等）才显式打开，风险自负。
# ｜ 32-bit targets are rejected by default; opt in explicitly.
allow-32bit = []
# SML 文本序列化器（to_sml）。只需解析/承载数据时可关闭，回到完全零依赖。
sml = []
# Value 的 Serialize/Deserialize 实现 + to_value/from_value 桥接。
# 注：吃 SML 文本的 `from_str` 在门面 crate（需要解析器）。
serde = ["dep:serde"]
# ⚠️ **已退场（2026-11-05，方案 2 / B）**：这个 feature 现在是 **no-op 兼容名**，
# 保留只是为了不破坏既有的 `--features preserve_order` 命令。
#
# 键序现在由**值自身**决定，不再由编译开关决定：
# - `Map::Unordered(BTreeMap)` —— 显式无序（`Map::unordered()`）
# - `Map::Ordered(Box<OrderedMap>)` —— 显式保源序（`Map::ordered()` / `parse_ordered()`）
#
# 所以「能不能签 canonical」取决于对象是哪一态，换任何 feature 组合都不改变结论。
# 保序实现仍是本 crate 零依赖自实现的（`object.rs`），不引 indexmap。
preserve_order = []
default = []