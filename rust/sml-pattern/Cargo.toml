[package]
name = "sml-pattern"
version = "0.1.0-alpha.2"
edition = "2021"
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
readme = "README.md"
description = "SML 模式语言（Loom 融入 SML）：L1 无回溯匹配引擎，免疫 ReDoS"

[dependencies]
sml-value = { version = "0.1.0-alpha.1", path = "../sml-value" }

[dev-dependencies]
# 仅测试需要：用 SML 解析器把规则源码变成 Value。
# 运行时本 crate 只依赖 sml-value（值模型），保持依赖单向。
swsml = { path = ".." }
