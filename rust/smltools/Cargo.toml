# smltools — SML (SNOWARE Markup Language) 命令行转换器 / 多目标翻译器。
#
# ⚠️ 实验性 (EXPERIMENTAL)：此 crate 从 swsml 主 crate 拆分为独立发布，
#    对外 CLI 接口与 emit 后端组合仍可能随用户反馈调整，暂不做语义化稳定性承诺。
#    生产关键路径请勿依赖其精确行为；建议关注版本号变更日志。
[package]
name = "smltools"
# 0.2.0：crate 由 `smlconv` 改名而来（原 crate 不再更新，包名/二进制名/文档引用一并迁移）。
# 改名对下游是不兼容变更（Cargo.toml、脚本、CI 里的名字都要改），按 0.x 纪律动 MINOR。
# 0.2.1：跟随 swsml 0.6.2 的 PATCH —— include 展开统一走 `sml::parse_file`（多目标 include
# 不再静默丢第二个文件）、错误码不再按文案猜、clap 用法错误带 `E-CLI-008`。
# ⚠️ 凡改动 `swsml = { version = ... }` 的**版本要求**，必须与 `rust/Cargo.toml` 的
#    swsml 版本同步，否则 crates.io 会解析到旧版（那份 emit 仍返回 `String`），本仓编译失败。
version.workspace = true
edition = "2021"
description = "(EXPERIMENTAL) SML command-line toolbox: migrate JSON/YAML into SML (--from), strip SML-only features for lossless interchange (--strip), lint documents, and translate SML into slint/lvgl/json/xml/svg/latex/markdown/html/hugo."
license = "MulanPSL-2.0"
repository = "https://gitee.com/snoware/sml"
homepage = "https://sml.swebase.cn"
readme = "README.md"
authors = ["Sal <sal@mail.swebase.cn>"]
keywords = ["sml", "converter", "codegen", "parser", "slint"]
categories = [
    "command-line-utilities",
    "parser-implementations",
    "template-engine",
    "text-processing",
    "gui",
]
exclude = ["/target"]

# 库接口（用户 2026-11-05：转换不能只有命令行，嵌进别人程序是更自然的路）。
# CLI 与库共用同一份实现，CLI 只是调用者之一。见 `src/envelope.rs` 的模块头。
[lib]
name = "smltools"
path = "src/lib.rs"

[[bin]]
name = "smltools"
path = "src/main.rs"

[dependencies]
# 错误码（唯一事实来源 errors/codes.sml）：CLI / 迁入格式 / lint 三层的对外错误
# 都引用这里的**常量**而不是手写字面量，避免打错一位数字。见 errors/README.md。
sml-codes = { version = "0.6.9-dev.0", path = "../sml-codes" }
# 复用 swsml 的解析器与 sml::emit::* 翻译后端，自身不重复实现。
swsml = { version = "0.6.9-dev.0", path = "../", features = [
    "sml",
    "emit-markdown",
    "emit-slint",
    "emit-latex",
    "emit-xml",
    "emit-svg",
    "emit-html",
    "emit-custom",
] }
clap = { version = "4.5", features = ["derive"] }
# `.smlb` 信封：包装 / 取出 / 列出载荷（D3：本 crate 可以依赖它，反之不行）
smlb = { version = "0.6.9-dev.0", path = "../smlb" }

[features]
# 对象保序：转发到 swsml（理由见 ../sml-parse/Cargo.toml 的同名注释 ——
# 本 crate 不吃 sml-value，但它是 swsml 的一个下游，少了这一条同样会分裂出两份）。
preserve_order = ["swsml/preserve_order", "smlb/preserve_order"]
# `.smlb` 段级压缩（zstd）。默认关：装上它就把 zstd 拉进依赖树，
# 与「默认构建零三方依赖」的口径冲突，故显式开启。
compress = ["smlb/compress"]