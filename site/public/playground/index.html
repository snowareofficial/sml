<!doctype html><html lang=zh><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SML Playground · SML { ❄ } — SNOWARE Markup Language</title><style>body{font-family:system-ui,microsoft yahei,sans-serif;margin:0;background:#fafafa;color:#111}header{background:#111;color:#fff;padding:18px 32px;display:flex;align-items:center;gap:12px}header h1{margin:0;font-size:20px}header a{color:#fff;text-decoration:none}header .flake{color:#42a5f5;font-size:22px}header .lang-switch{margin-left:auto;display:flex;gap:6px}header .lang-switch a{color:#90caf9;font-size:13px;padding:4px 10px;border:1px solid #333;border-radius:6px;text-decoration:none}header .lang-switch a.active{background:#1565c0;color:#fff;border-color:#1565c0}nav{background:#1c1c1c;padding:8px 32px;position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:4px 18px}nav a{color:#90caf9;text-decoration:none;font-size:14px}nav a:hover{text-decoration:underline}nav .home{color:#fff;font-weight:600}main{max-width:880px;margin:24px auto;padding:0 24px}h2{scroll-margin-top:56px}article{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:24px 32px}h1,h2,h3{color:#0d47a1}h2{border-bottom:2px solid #42a5f5;padding-bottom:6px}code{background:#eef4fb;padding:2px 6px;border-radius:4px;font-size:.9em;color:#1565c0}pre{background:#111;color:#e8f1fb;padding:12px;border-radius:6px;overflow-x:auto}pre code{background:0 0;color:inherit}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#eef4fb;color:#0d47a1}.links{display:flex;gap:12px;margin:16px 0}.btn{display:inline-block;background:#1565c0;color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;font-weight:600}.btn:hover{background:#0d47a1}footer{text-align:center;padding:24px;color:#666;font-size:13px}</style></head><body><header><img src=../sml.svg alt=sml style="width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,. <a href=#本地-playground>Playground</a></nav><main><article><h1>SML Playground</h1><h1 id=sml-playground--->SML Playground { ❄ }</h1><p>在浏览器里直接解析 SML —— 支持契约校验、片段继承、include 转义。基于最新 JavaScript 实现（<code>sml.mjs</code>，零依赖 ESM）。</p><style>.pg-wrap{display:flex;gap:16px;flex-wrap:wrap}.pg-pane{flex:1 1 360px;min-width:300px}.pg-pane h3{margin:6px 0;color:#0d47a1}textarea#src{width:100%;height:420px;font-family:sfmono-regular,Consolas,monospace;font-size:13px;line-height:1.5;padding:10px;border:1px solid #cfd8dc;border-radius:8px;background:#0d1117;color:#e6edf3;resize:vertical;tab-size:2}pre#out{width:100%;height:420px;overflow:auto;margin:0;padding:10px;border:1px solid #cfd8dc;border-radius:8px;background:#0d1117;color:#e6edf3;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}pre#out.error{color:#ff8a80;border-color:#b71c1c}.pg-bar{margin:8px 0;font-size:13px;color:#555}.pg-bar .ok{color:#2e7d32;font-weight:600}.pg-bar .bad{color:#c62828;font-weight:600}.pg-samples{margin:10px 0}.pg-samples button{background:#1565c0;color:#fff;border:0;padding:6px 12px;margin-right:8px;border-radius:6px;cursor:pointer;font-size:13px}.pg-samples button:hover{background:#0d47a1}</style><div class=pg-samples><span style=font-size:13px;color:#555>示例：</span>
<button data-sample=contract>契约校验</button>
<button data-sample=fragment>片段继承</button>
<button data-sample=array>数组/枚举</button>
<button data-sample=bad>故意出错</button></div><div class=pg-wrap><div class=pg-pane><h3>SML 源码</h3><textarea id=src spellcheck=false></textarea></div><div class=pg-pane><h3>解析结果</h3><pre id=out>（输入左侧内容…）</pre></div></div><div class=pg-bar id=bar></div><script type=module>
  import { parse, parseSafe, stringify } from "/sml.mjs";

  const SAMPLES = {
    contract:
`@contract Cfg loose {
    api_key: str
    port:    int default 8080 min 1 max 65535
    debug:   bool default false
    mode:    enum(active, disabled) default active
}
@is Cfg
api_key: re_abc123
port: 9090
debug: true
mode: active`,
    fragment:
`@base { region: cn-north-1 timeout: 30 }
service auth { &base port: 7100 name: auth-svc }
service billing { &base port: 7200 name: billing-svc }
features: [ logging metrics tracing ]
database: {
    url: "postgres://localhost/app"
    pool: { min: 2 max: 16 }
}`,
    array:
`@contract U { kind: enum(active,disabled) tags: array[str] ? }
@is U
kind: active
tags: [ a b c ]`,
    bad:
`@contract Cfg strict { api_key: str port: int }
@is Cfg
api_key: re_xxx
port: 99999
extra: oops`,
  };

  const src = document.getElementById("src");
  const out = document.getElementById("out");
  const bar = document.getElementById("bar");

  function render() {
    const text = src.value;
    const r = parseSafe(text);
    if (r.ok) {
      out.classList.remove("error");
      out.textContent = JSON.stringify(r.value, null, 2);
      bar.innerHTML = '<span class="ok">✓ 解析成功</span> · ' +
        Object.keys(flatten(r.value)).length + " 个叶子字段";
    } else {
      out.classList.add("error");
      let msg = r.error;
      if (r.position) msg += `  (行 ${r.position.line + 1}, 列 ${r.position.col + 1})`;
      out.textContent = "✗ " + msg;
      bar.innerHTML = '<span class="bad">✗ 解析失败</span>';
    }
  }

  function flatten(o, acc = {}) {
    if (o && typeof o === "object" && !Array.isArray(o)) {
      for (const k of Object.keys(o)) {
        if (k === "__type" || k === "__name") continue;
        if (o[k] && typeof o[k] === "object") flatten(o[k], acc);
        else acc[k] = o[k];
      }
    }
    return acc;
  }

  src.addEventListener("input", render);
  document.querySelectorAll(".pg-samples button").forEach((b) => {
    b.addEventListener("click", () => {
      src.value = SAMPLES[b.dataset.sample] || "";
      render();
    });
  });

  // 初始示例
  src.value = SAMPLES.contract;
  render();
</script></article></main><footer>SML · SNOWARE Markup Language · { ❄ }</footer></body></html>
