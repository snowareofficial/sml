baseURL = "/"
title = "SML { ❄ } — SNOWARE Markup Language"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
theme = "sml-docs"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "robotsTXT", "404"]
ignoreLogs = ["warning-goldmark-raw-html"]
relativeURLs = true

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "SML（SNOWARE Markup Language）与 BamZap 包管理器的独立站点"

# 多语言：zh 默认 (content/), en (content/en/ 由 Hugo 自动识别)
[languages]
  [languages.zh]
    weight = 1
    label = "中文"
  [languages.en]
    weight = 2
    label = "EN"
