# Cloudflare Pages 部署配置 — sml.swebase.cn
# 构建: python build_site.py（hugo 输出到 out/build/sml-site）
# 部署: wrangler pages deploy <构建输出目录> --project-name sml-site（在 site/ 下运行）
name = "sml-site"
pages_build_output_dir = "public"
compatibility_date = "2025-08-14"

[env.production]
# 生产域名（在 Cloudflare 控制台绑定自定义域 sml.swebase.cn）
