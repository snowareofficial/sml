<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · {{ .Site.Title }}</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; background: #fafafa; color: #111; }
    header { background: #111; color: #fff; padding: 18px 32px; display: flex; align-items: center; gap: 12px; }
    header h1 { margin: 0; font-size: 20px; }
    header a { color: #fff; text-decoration: none; }
    header .flake { color: #42A5F5; font-size: 22px; }
    nav { background: #1c1c1c; padding: 8px 32px; position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 4px 18px; }
    nav a { color: #90caf9; text-decoration: none; font-size: 14px; }
    nav a:hover { text-decoration: underline; }
    nav .home { color: #fff; font-weight: 600; }
    main { max-width: 880px; margin: 24px auto; padding: 0 24px; }
    /* 章节书签跳转后标题不被顶栏遮挡 */
    h2 { scroll-margin-top: 56px; }
    article { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 24px 32px; }
    h1, h2, h3 { color: #0d47a1; }
    h2 { border-bottom: 2px solid #42A5F5; padding-bottom: 6px; }
    code { background: #eef4fb; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; color: #1565C0; }
    pre { background: #111; color: #e8f1fb; padding: 12px; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; color: inherit; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #eef4fb; color: #0d47a1; }
    .links { display: flex; gap: 12px; margin: 16px 0; }
    .btn { display: inline-block; background: #1565C0; color: #fff; padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .btn:hover { background: #0d47a1; }
    footer { text-align: center; padding: 24px; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <img src="{{ .Site.Home.RelPermalink }}sml.svg" alt="sml" style="width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))">
    <h1><a href="{{ .Site.Home.RelPermalink }}">SML { ❄ }</a></h1>
  </header>
  <nav>
    <a class="home" href="{{ .Site.Home.RelPermalink }}">SML</a>
    {{ with .Site.GetPage "/" }}
    <a href="#特性一览">特性一览</a>
    <a href="#多语言实现对照">多语言实现对照</a>
    <a href="#快速使用">快速使用</a>
    <a href="#契约系统contract">契约系统</a>
    <a href="#进阶特性">进阶特性</a>
    <a href="#落地应用">落地应用</a>
    <a href="#完整示例">完整示例</a>
    <a href="#本地-playground">Playground</a>
    {{ end }}
  </nav>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>SML · SNOWARE Markup Language · { ❄ }</footer>
</body>
</html>
