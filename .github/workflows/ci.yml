# CI：在 GitHub 跑测试与门禁（Gitee 是权威源，GitHub 是镜像 + CI）。
#
# 设计要点：
# - 本仓库是 monorepo，各端实现分散在不同目录，每个 job 的工作目录 / 命令都显式写清。
# - 失败必须传导：任何 `run:` 步骤 rc≠0 ⇒ 该 job 失败 ⇒ 挡住合并。
#   不写 `|| true`、不加 `continue-on-error`。
# - 门禁的全部价值在「失败真的会红」：osv_check.py 有洞即失败、build_verify.py 的
#   RS-BRIDGE 缺库即失败（见 TASK-agent-w8-w9.md §W9）。
# - 注意：workflow 的 `name:` 不要含特殊字符（如箭头 →），否则 GitHub 会静默拒绝解析。
#   本文件 name 用纯 ASCII。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rust 全 workspace 测试（默认不开 serde，故 serde 套件单列在 rust-serde）
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: 测试 workspace
        # swsml 的 [lib] 同时是 rlib + cdylib，且多个成员以不同 feature 集依赖它
        # ⇒ cargo #6313 输出文件名碰撞（libsml.rlib），workspace 合跑可能让下游成员
        # 找不到自己的 rlib。按 cargo 自己的建议「compiling them separately」拆两步：
        #   - 其余成员合跑；- 门面 swml 单独跑（单独跑时 feature 集唯一，无碰撞）。
        run: |
          cargo test --workspace --exclude swml
          cargo test -p swml
      - name: Clippy 门禁（-D warnings）
        # 2026-11-07 把 clippy 从 182 清到 0；结构类 4 处 `#[allow]` 都写了理由
        # （热路径 enum / 词法游标 / derive 宏生成的构造器），不是无脑放行。
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 零依赖承诺的钉子：README / rust/Cargo.toml 都写「default-features = false 回到完全零依赖」。
      # 2026-11-02 实测发现该承诺是假的（`pub use crate::emit::MAX_VALUE_DEPTH` 没 cfg，
      # 而 `pub mod emit` 被 7 个 emit-* 门控 ⇒ E0432）。已修，并在此加门禁防复发：
      # 任何新增「无 cfg 却引用 emit」的代码都会让这一步红。
      - name: 零 feature 档必须能编译（零依赖承诺）
        run: cargo check -p swsml --no-default-features
      # 跨端 canonical 向量（.ambr T0）：**必须单列** —— `amberice` 的 preserve_order 是 opt-in，
      # 上面那条 `--workspace` 跑的是默认档，只验证「没有源序时明确报错」（C2），
      # 而向量文件与代码是否一致（C12 的字节契约）只有带 feature 才验得到。
      # 不把它并进 `--workspace --features ...`：特性按构建图取并集，那会把整个 workspace 的
      # sml-value 一起切到保序档，等于顺手改掉 swsml / smltools 上百条「默认档 = 字节序」的 golden。
      - name: .ambr 全部（保序 + 签名）
        run: cargo test -p amberice --features preserve_order,sign,compress

  # serde 套件不在 --workspace 里（tests/serde_bridge.rs 是 cfg(feature = "serde")），必须单列
  rust-serde:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: serde 桥
        run: cargo test --features serde --test serde_bridge
      # ⚠️ 必须单列：`tests/ser_de_direct.rs` 顶部是 `#![cfg(all(feature = "serde", feature = "sml"))]`
      # ⇒ 默认 `cargo test --workspace` 下**整个文件编译成空、0 条用例**（实测两个分支都是 0 passed）。
      # 而它锁着 I-1 的「两条发射器逐字节一致」与雷 5 B 组的浮点 raw 钉子，漏跑等于没锁。
      - name: 直出发射器（ser_de_direct，含字节一致性锁）
        run: cargo test --features serde --test ser_de_direct
      - name: sml-value serde
        run: cargo test -p sml-value --features sml,serde

  # 非 Rust 各端自检：C / C++ / JS / Lua
  # C++ 的 RS-BRIDGE 链接 Rust cdylib，故先构建 release 再显式传 SML_RUST_LIB
  non-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 构建 Rust cdylib（供 C++ RS-BRIDGE 链接）
        working-directory: rust
        run: cargo build --release
      # 写入路径需要解析器，故 `amberice-ffi` 必须带 `sml` feature 单独构建一次；
      # 上一步的 `cargo build` 不带该 feature（保持 `amberice` 不依赖解析器）。
      - name: 构建 amberice-ffi（写入能力，供 C/C++/Python 写入测试）
        working-directory: rust
        run: cargo build --release -p amberice-ffi --features sml
      - name: C 检查（必须在 c/ 里跑）
        working-directory: c
        run: python3 build_check.py --run
      - name: C++ 验证（脚本内部 cwd=HERE，从哪跑都一样）
        env:
          SML_RUST_LIB: ${{ github.workspace }}/rust/target/release
        run: python3 cpp/build_verify.py
      - name: JS 错误码探针
        run: node js/probe-error-codes.mjs
      # N03 / T7：`.ambr` 解码器对拍容器向量（21 例）。fixture 由 Rust 侧生成，
      # 这一步是「四端照文件对齐」的第一个可执行判据。
      - name: JS .ambr 解码器（容器向量）
        run: node js/test-ambr-decoder.mjs
      - name: JS 四份副本一致性
        run: python3 tools/check/check_js_copies.py
      - name: Lua 检查
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua5.4
          python3 lua/run_check.py
      # 纯 Lua 5.3+ 编码器：不依赖 FFI / cdylib，单独验证一遍逐字节一致。
      # ｜ Pure-Lua 5.3+ writer, no FFI and no cdylib.
      - name: Lua 5.4 纯实现写入（21 例逐字节）
        run: lua5.4 lua/test_ambr_write.lua
      # `.ambr` 写入：C / C++ / Python 各跑一遍 pack→load。脚本在没有 cdylib 时
      # 显式 SKIP（退出 0）而不是假绿；真正的失败（编译错 / 断言错 / 崩溃）一律非零。
      - name: .ambr 写入（C / C++ / Python）
        env:
          AMBR_LIB: ${{ github.workspace }}/rust/target/release/libamberice_ffi.so
        run: |
          # 先打一行产物清单：失败时能一眼分清「cdylib 没编出来」和「脚本找错路径」。
          # ｜ Print the artifact list first so a failure is diagnosable.
          ls -l rust/target/release/libamberice_ffi.* 2>/dev/null || echo "NO libamberice_ffi.* in rust/target/release"
          python3 tools/check/check_ambr_write.py

  # 守卫：私有资产不进主库 + 错误码生成物幂等（需要全历史，故 fetch-depth: 0）
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 构建 smltools 并加入 PATH（错误码生成器依赖它）
        working-directory: rust
        run: |
          cargo build --release -p smltools
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: 私有资产守卫
        run: python3 tools/check/check_private_assets.py
      - name: 错误码生成物幂等校验
        run: |
          python3 errors/gen_json.py
          python3 errors/gen_codes.py
          git diff --exit-code
      # 文档门禁：docs/meta.sml 是唯一清单。未登记 / 断链 / stale 无替代者 / updated 超期
      # 任一命中即红。**放在 `git diff --exit-code` 之后** —— 它自己会重写 docs/report.md。
      - name: 文档门禁（meta.sml → 索引 / 体检 / 断链）
        working-directory: rust
        run: cargo run -p smldocs -- --check
      # 生成物幂等：数据源变了却没重跑生成 ⇒ 这里变红。生成物不记日期，
      # scan.md 内容不变时不重写，所以跨天重跑也不会假红。
      - name: 文档生成物重跑
        working-directory: rust
        run: |
          cargo run -p smldocs -- --index
          cargo run -p smldocs -- --report
      - name: 状态扫描重跑
        run: python3 tools/scan_status.py --write
      - name: 生成物无漂移
        run: git diff --exit-code -- docs/index.md docs/report.md docs/repo/ref/scan.md

  # Miri：C-ABI 的 UB 检测（很慢，单独 job + 超时，不允许 continue-on-error）
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: 安装 nightly + Miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup
      - name: Miri 跑 c_abi
        run: python3 miri_check.py --test c_abi --timeout 300 --no-setup

  # OSV 依赖漏洞门禁（依赖 W9.1 的退出码）
  osv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: OSV 依赖漏洞门禁
        run: python3 osv_check.py
